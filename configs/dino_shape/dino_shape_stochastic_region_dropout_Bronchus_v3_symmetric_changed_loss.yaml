experiment_name: dino_shape_stochastic_region_dropout_Bronchus_v3_symmetric_changed_loss
output_root: /scratch/shaohan/contour_QA/dino_stochastic_region_dropout
seed: 92

dino:
  repo_path: /home/shaohan/3DINO
  checkpoint_path: /home/shaohan/3DINO/pretrained/3dino_vit_weights.pth
  config_name: train/vit3d_highres

data:
  roi_name: Bronchus
  train_label_dir: /home/shaohan/radformation-data/preprocessed_roiwise_allrois_1p5mm_nozoom/airway/Bronchus/training1/airway/Bronchus/labels
  validation_label_dir: /home/shaohan/radformation-data/preprocessed_roiwise_allrois_1p5mm_nozoom/airway/Bronchus/validation1/airway/Bronchus/labels
  test_label_dir: /home/shaohan/radformation-data/preprocessed_roiwise_allrois_1p5mm_nozoom/airway/Bronchus/testing1/airway/Bronchus/labels

decoder:
  channels: [256, 128, 64, 32]

stochastic_region_dropout:
  implementation_version: fast_v4_global_sdf_offset
  spacing_zyx: [1.5, 1.5, 1.5]
  clean_probability: 0.20
  # Match the successful Lung_L v3 branch structure, while retaining the
  # Bronchus-specific warp/noise/dropout scales from the existing Bronchus v1.
  branch_probabilities:
    smooth_warp: 0.10
    distance_noise: 0.20
    combined: 0.15
    stochastic_region_dropout: 0.20
    global_boundary_offset: 0.15
  smooth_warp:
    control_grid_points_zyx:
      min: [4, 4, 4]
      max: [7, 7, 7]
    gaussian_sigma_vox: [4.0, 9.0]
    max_displacement_mm: [2.0, 6.0]
    upsample_order: 1
  distance_noise:
    gaussian_sigma_vox: [2.5, 6.0]
    amplitude_mm: [0.75, 3.0]
    remove_small_components: true
    min_component_voxels: 8
    keep_largest_component: false
  global_boundary_offset:
    # Continuous physical SDF offsets, not the benchmark's binary
    # erosion/dilation operators.  Bronchus is thin, so start with 1-2 voxels.
    magnitude_mm: [1.5, 3.0]
    outward_probability: 0.50
  dropout:
    coarse_grid_points_zyx:
      min: [4, 4, 4]
      max: [7, 7, 7]
    correlation_length_mm: [6.0, 20.0]
    localization_sigma_mm: [8.0, 25.0]
    random_field_weight: 1.0
    localization_weight: 1.5
    localization_cutoff_sigma: 3.5
    upsample_order: 1
    threshold_search_steps: 8
    removed_fraction: [0.03, 0.25]
    removed_fraction_tolerance: 0.06
    min_max_depth_mm: 1.5
    max_max_depth_mm: 20.0
    max_extra_remaining_components: 3
    max_attempts: 8

training:
  device: cuda:0
  batch_size: 1
  accumulation_steps: 4
  num_workers: 8
  prefetch_factor: 2
  validation_cache:
    enabled: true
  num_epochs: 200
  early_stopping_patience: 40
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  precision: bf16
  timing:
    enabled: true
    sync_cuda: true
    log_every_steps: 10

loss:
  global_dice_weight: 0.40
  global_bce_weight: 0.10
  # Transfer the Lung_L v3 directional-symmetry ablation to Bronchus.
  changed_region_bce_weight: 0.50
  missing_region_bce_weight: 0.00
  changed_region_voxel_weight: 8.0
  changed_region_dilation_voxels: 3

evaluation:
  threshold: 0.5

study_metadata:
  crop_localization: approved_label_oracle
  deployment_scope: shape_QA_after_oracle_localization
  training_corruption_overlap: benchmark_independent_stochastic_dropout_plus_continuous_global_sdf_offset
  primary_hypothesis: symmetric_changed_region_supervision_transfers_to_thin_branching_Bronchus
  transfer_from: dino_shape_stochastic_region_dropout_Lung_L_v3_symmetric_changed_loss
  bronchus_specific_global_offset_mm: [1.5, 3.0]
