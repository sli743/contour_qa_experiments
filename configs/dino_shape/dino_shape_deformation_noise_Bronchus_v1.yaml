experiment_name: dino_shape_deformation_noise_Bronchus_v1
output_root: /scratch/shaohan/contour_QA/dino_deformation_noise
seed: 88

dino:
  repo_path: /home/shaohan/3DINO
  checkpoint_path: /home/shaohan/3DINO/pretrained/3dino_vit_weights.pth
  config_name: train/vit3d_highres

data:
  roi_name: Bronchus
  train_label_dir: /home/shaohan/radformation-data/preprocessed_roiwise_allrois_1p5mm_nozoom/airway/Bronchus/training1/airway/Bronchus/labels
  validation_label_dir: /home/shaohan/radformation-data/preprocessed_roiwise_allrois_1p5mm_nozoom/airway/Bronchus/validation1/airway/Bronchus/labels
  test_label_dir: /home/shaohan/radformation-data/preprocessed_roiwise_allrois_1p5mm_nozoom/airway/Bronchus/testing1/airway/Bronchus/labels

decoder:
  channels: [256, 128, 64, 32]

deformation_noise:
  spacing_zyx: [1.5, 1.5, 1.5]
  clean_probability: 0.20
  branch_probabilities:
    smooth_warp: 0.35
    distance_noise: 0.20
    combined: 0.25
  smooth_warp:
    control_grid_points_zyx:
      min: [4, 4, 4]
      max: [7, 7, 7]
    gaussian_sigma_vox: [4.0, 9.0]
    max_displacement_mm: [2.0, 6.0]
  distance_noise:
    gaussian_sigma_vox: [2.5, 6.0]
    amplitude_mm: [0.75, 3.0]
    remove_small_components: true
    min_component_voxels: 8
    keep_largest_component: false
  validity:
    min_retained_volume_fraction: 0.55
    max_volume_change_fraction: 0.50
    max_attempts: 8
    # Bronchus approved contours may legitimately contain multiple substantial
    # components, so topology acceptance is relative to each clean target.
    max_extra_components: 3
    min_largest_component_fraction_ratio: 0.75
    min_absolute_largest_component_fraction: 0.30

training:
  device: cuda:0
  batch_size: 1
  accumulation_steps: 4
  num_workers: 2
  num_epochs: 200
  early_stopping_patience: 40
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  precision: bf16

loss:
  global_dice_weight: 0.50
  global_bce_weight: 0.10
  changed_region_bce_weight: 0.40
  changed_region_voxel_weight: 8.0
  changed_region_dilation_voxels: 3

evaluation:
  threshold: 0.5

study_metadata:
  crop_localization: approved_label_oracle
  deployment_scope: shape_QA_after_oracle_localization
  training_corruption_overlap: continuous_deformation_only
